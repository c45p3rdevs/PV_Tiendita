/* ── ESTADO Y CONFIGURACIÓN ───────────────────────────────── */
const KEY='tiendita-pos-v1';
let storageOK=true;

function initAppState(){
  let saved = null;
  try {
    const raw = localStorage.getItem(KEY);
    if(raw) saved = JSON.parse(raw);
  } catch(e){
    storageOK = false;
  }
  
  const phoneUsers = (saved && saved.phoneUsers && saved.phoneUsers.length) 
    ? saved.phoneUsers 
    : ['4481294345'];

  if(!phoneUsers.includes('4481294345')){
    phoneUsers.unshift('4481294345');
  }

  return {
    loggedIn: false,
    currentPhone: '',
    phoneUsers: phoneUsers,
    view: 'venta',
    products: saved?.products || [],
    sales: saved?.sales || [],
    entries: saved?.entries || [],
    customers: saved?.customers || [],
    cart: saved?.cart || [],
    paid: saved?.paid || 0,
    payMethod: 'Efectivo',
    creditCustomerId: '',
    phone: '',
    settings: saved?.settings || {store:'Mi Tiendita', symbol:'$', minStock:5},
    ui: {posSearch:'', posCat:'', invSearch:'', invCat:'', invLow:false, custSearch:'', entryProduct:'', repMonth:thisMonth()}
  };
}

const state = initAppState();

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      phoneUsers: state.phoneUsers,
      products: state.products,
      sales: state.sales,
      entries: state.entries,
      customers: state.customers,
      cart: state.cart,
      settings: state.settings
    }));
    storageOK = true;
  } catch(e){
    storageOK = false;
  }
  renderBadge();
}

/* ── CÁLCULOS Y CRÉDITOS ──────────────────────────────────── */
const getProduct=id=>state.products.find(p=>p.id===id), activeSales=()=>state.sales.filter(s=>!s.cancelled);
const getCustomer=id=>state.customers.find(c=>c.id===id);
const margin=p=>p.price>0?((p.price-p.cost)/p.price)*100:0;
const stats=list=>({revenue:list.reduce((a,s)=>a+s.total,0),profit:list.reduce((a,s)=>a+s.profit,0),units:list.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0),count:list.length,avg:list.length?list.reduce((a,s)=>a+s.total,0)/list.length:0});
const monthStats=ym=>stats(activeSales().filter(s=>monthOf(s.date)===ym));
const dayStats=ds=>stats(activeSales().filter(s=>s.date.slice(0,10)===ds));
function lastNDays(n){const out=[],now=new Date();for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;out.push({ds,...dayStats(ds)});}return out;}
function topProducts(ym,by='profit',limit=6){const m=new Map();activeSales().filter(s=>monthOf(s.date)===ym).forEach(s=>s.items.forEach(i=>{if(!m.has(i.id))m.set(i.id,{id:i.id,name:i.name,qty:0,revenue:0,profit:0});const o=m.get(i.id);o.qty+=i.qty;o.revenue+=i.price*i.qty;o.profit+=(i.price-i.cost)*i.qty;}));return [...m.values()].sort((a,b)=>b[by]-a[by]).slice(0,limit);}
function categoryProfit(ym){const m=new Map();activeSales().filter(s=>monthOf(s.date)===ym).forEach(s=>s.items.forEach(i=>{const p=getProduct(i.id),c=p?p.cat:'Otros';m.set(c,(m.get(c)||0)+(i.price-i.cost)*i.qty);}));return [...m.entries()].sort((a,b)=>b[1]-a[1]);}
const inventoryValue=()=>state.products.reduce((a,p)=>a+p.cost*p.stock,0), inventorySaleValue=()=>state.products.reduce((a,p)=>a+p.price*p.stock,0);
const lowStockList=()=>state.products.filter(p=>p.stock<=p.min).sort((a,b)=>a.stock-b.stock);
const stockState=p=>p.stock<=0?'out':(p.stock<=p.min?'low':'ok');
const productCats=()=>[...new Set(state.products.map(p=>p.cat))].sort();

/* ── CÁLCULOS DE DEUDAS Y FIADOS ─────────────────────────── */
function customerDebt(cId){
  const creditSales = activeSales().filter(s => s.payMethod==='Crédito' && s.customerId===cId);
  const totalCred = creditSales.reduce((sum, s) => sum + s.total, 0);
  const c = getCustomer(cId);
  const totalPaid = c && c.payments ? c.payments.reduce((sum, p) => sum + p.amount, 0) : 0;
  return Math.max(0, totalCred - totalPaid);
}
function customerProducts(cId){
  const creditSales = activeSales().filter(s => s.payMethod==='Crédito' && s.customerId===cId);
  const map = new Map();
  creditSales.forEach(s => s.items.forEach(i => {
    if(!map.has(i.name)) map.set(i.name, {name: i.name, qty: 0, total: 0});
    const item = map.get(i.name);
    item.qty += i.qty;
    item.total += (i.price * i.qty);
  }));
  return [...map.values()];
}
function totalGlobalDebt(){
  return state.customers.reduce((sum, c) => sum + customerDebt(c.id), 0);
}

  const S={ok:['bg-emerald-50 border-emerald-200 text-emerald-800','check','text-emerald-600'],warn:['bg-amber-50 border-amber-200 text-amber-900','warn','text-amber-600'],error:['bg-rose-50 border-rose-200 text-rose-800','warn','text-rose-600'],info:['bg-white border-slate-200 text-slate-700','bolt','text-indigo-600']}[type];
  const el=document.createElement('div');
  el.className=`pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-2xl border shadow-lg ${S[0]} pop`;
  el.innerHTML=`<span class="mt-0.5 ${S[2]}">${icon(S[1],'w-5 h-5')}</span><p class="text-[13.5px] font-semibold flex-1">${esc(msg)}</p>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s,transform .3s';el.style.opacity='0';el.style.transform='translateX(20px)';setTimeout(()=>el.remove(),320);},2600);
}

function sendWhatsAppTicket(saleData, customPhone = '') {
  const store = state.settings.store || 'Mi Tiendita';
  const dateStr = saleData.date ? new Date(saleData.date).toLocaleString('es-MX') : new Date().toLocaleString('es-MX');
  
  let msg = `🧾 *TICKET DE COMPRA*\n`;
  msg += `🏪 *${store}*\n`;
  msg += `📅 ${dateStr}\n`;
  msg += `------------------------------\n`;
  
  saleData.items.forEach(item => {
    msg += `• ${item.name}\n  ${item.qty} x ${MXN(item.price)} = *${MXN(item.price * item.qty)}*\n`;
  });
  
  msg += `------------------------------\n`;
  msg += `💰 *TOTAL: ${MXN(saleData.total)}*\n`;
  msg += `💳 Pago: ${saleData.payMethod}\n`;
  if(saleData.payMethod === 'Crédito' && saleData.customerId){
    const c = getCustomer(saleData.customerId);
    if(c) msg += `👤 Cliente: ${c.name}\n`;
  }
  if (saleData.payMethod === 'Efectivo' && saleData.paid > 0) {
    msg += `💵 Recibido: ${MXN(saleData.paid)}\n`;
    if (saleData.change > 0) msg += `🪙 Cambio: ${MXN(saleData.change)}\n`;
  }
  msg += `\n¡Gracias por su compra! 🙌`;

  const phone = (customPhone || state.phone || '').replace(/[^0-9]/g, '');
  const encoded = encodeURIComponent(msg);
  const url = phone ? `https://wa.me/${phone}?text=${encoded}` : `https://wa.me/?text=${encoded}`;
  window.open(url, '_blank');
}

function sendWhatsAppDebtTicket(cId){
  const c = getCustomer(cId);
  if(!c) return;
  const debt = customerDebt(cId);
  const prods = customerProducts(cId);
  const store = state.settings.store || 'Mi Tiendita';

  let msg = `📌 *ESTADO DE CUENTA / FIADO*\n`;
  msg += `🏪 *${store}*\n`;
  msg += `👤 Cliente: *${c.name}*\n`;
  msg += `📅 Fecha: ${new Date().toLocaleDateString('es-MX')}\n`;
  msg += `------------------------------\n`;
  msg += `🛒 *PRODUCTOS ADQUIRIDOS:*\n`;
  if(prods.length === 0){
    msg += `(Sin productos registrados)\n`;
  } else {
    prods.forEach(p => {
      msg += `• ${p.name} (${p.qty} u.) = ${MXN(p.total)}\n`;
    });
  }
  msg += `------------------------------\n`;
  msg += `⚠️ *TOTAL PENDIENTE DE PAGO: ${MXN(debt)}*\n\n`;
  msg += `Por favor realice su abono o pago a la brevedad. ¡Muchas gracias por su preferencia! 🙏`;

  const phone = (c.phone || '').replace(/[^0-9]/g, '');
  const encoded = encodeURIComponent(msg);
  const url = phone ? `https://wa.me/${phone}?text=${encoded}` : `https://wa.me/?text=${encoded}`;
  window.open(url, '_blank');
}

      if(amount<=0||amount>debt){toast('Ingresa un monto de abono válido','warn');return;}

      c.payments.push({id:uid(),date:stamp(),amount,note});
      save();toast(`Abono de ${MXN(amount)} registrado a ${c.name}`);closeModal();renderAll();
    };
  });
}

};

/* ── EVENTOS GLOBALES ─────────────────────────────────────── */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if(!b) return;
  const act = b.dataset.action;

  if(act==='go') go(b.dataset.view);
  else if(act==='logout'){
    state.loggedIn = false;
    state.currentPhone = '';
    renderApp();
    toast('Sesión cerrada');
  }
  else if(act==='close-modal') closeModal();
  else if(act==='confirm-yes'){ if(confirmCb) confirmCb(); closeModal(); }
  else if(act==='pos-cat'){ state.ui.posCat = b.dataset.cat; renderPosChips(); renderPosGrid(); }
  else if(act==='inv-cat'){ state.ui.invCat = b.dataset.cat; state.ui.invLow = false; renderView(); }
  else if(act==='inv-filter-low'){ state.ui.invLow = !state.ui.invLow; renderView(); }
  else if(act==='add'){
    const p = getProduct(b.dataset.id);
    if(!p || p.stock<=0) return;
    const item = state.cart.find(i=>i.id===p.id);
    if(item){
      if(item.qty >= p.stock){ toast('Stock máximo alcanzado en carrito','warn'); return; }
      item.qty = r3(item.qty + 1);
    } else {
      state.cart.push({id:p.id, name:p.name, price:p.price, cost:p.cost, qty:1});
    }
    save(); renderCartAside(); renderCartBar();
  }
  else if(act==='qty-inc'||act==='qty-dec'){
    const item = state.cart.find(i=>i.id===b.dataset.id);
    if(!item) return;
    const p = getProduct(item.id);
    if(act==='qty-inc'){
      if(p && item.qty >= p.stock){ toast('Stock máximo alcanzado','warn'); return; }
      item.qty = r3(item.qty + 1);
    } else {
      item.qty = r3(item.qty - 1);
      if(item.qty <= 0) state.cart = state.cart.filter(i=>i.id!==item.id);
    }
    save(); renderCartAside(); renderCartBar();
    if($('#modalRoot').innerHTML) openCartModal();
  }
  else if(act==='cart-del'){
    state.cart = state.cart.filter(i=>i.id!==b.dataset.id);
    save(); renderCartAside(); renderCartBar();
    if($('#modalRoot').innerHTML) openCartModal();
  }
  else if(act==='cart-clear'){
    state.cart = [];
    save(); renderCartAside(); renderCartBar();
    if($('#modalRoot').innerHTML) closeModal();
  }
  else if(act==='pay'){
    state.payMethod = b.dataset.m;
    save(); renderCartAside();
    if($('#modalRoot').innerHTML) openCartModal();
  }
  else if(act==='quick-paid'){
    state.paid = parseFloat(b.dataset.v)||0;
    save(); renderCartAside();
    if($('#modalRoot').innerHTML) openCartModal();
  }
  else if(act==='checkout'){
    if(!state.cart.length) return;
    const t = cartTotals();
    if(state.payMethod === 'Efectivo' && t.due > 0){ toast('El pago en efectivo es menor al total','warn'); return; }
    if(state.payMethod === 'Crédito' && !state.creditCustomerId){ toast('Selecciona un cliente para fiar','warn'); return; }

    state.cart.forEach(i => {
      const p = getProduct(i.id);
      if(p) p.stock = Math.max(0, r3(p.stock - i.qty));
    });

    const saleObj = {
      id: uid(),
      date: stamp(),
      items: [...state.cart],
      total: t.sub,
      profit: t.profit,
      payMethod: state.payMethod,
      customerId: state.payMethod==='Crédito'? state.creditCustomerId : null,
      paid: state.payMethod==='Efectivo'? (state.paid||t.sub) : 0,
      change: state.payMethod==='Efectivo'? t.change : 0
    };

    state.sales.unshift(saleObj);
    state.cart = [];
    state.paid = 0;
    save();
    closeModal();
    showSuccess(t.sub, saleObj.change, state.payMethod, saleObj);
    renderAll();
  }
  else if(act==='send-wa-cart'){
    if(!state.cart.length){ toast('El carrito está vacío','warn'); return; }
    const t = cartTotals();
    sendWhatsAppTicket({
      date: stamp(),
      items: state.cart,
      total: t.sub,
      payMethod: state.payMethod,
      customerId: state.creditCustomerId,
      paid: state.paid,
      change: t.change
    });
  }
  else if(act==='product-new') openProductModal();
  else if(act==='product-edit') openProductModal(getProduct(b.dataset.id));
  else if(act==='product-del'){
    confirmDialog('¿Eliminar producto?', 'El producto será borrado del inventario.', () => {
      state.products = state.products.filter(p=>p.id!==b.dataset.id);
      save(); renderAll(); toast('Producto eliminado');
    });
  }
  else if(act==='inv-quick-entry'){
    state.ui.entryProduct = b.dataset.id;
    go('entradas');
  }
  else if(act==='customer-new') openCustomerModal();
  else if(act==='customer-edit') openCustomerModal(getCustomer(b.dataset.id));
  else if(act==='customer-pay') openPaymentModal(b.dataset.id);
  else if(act==='customer-wa-debt') sendWhatsAppDebtTicket(b.dataset.id);
  else if(act==='delete-phone'){
    const ph = b.dataset.phone;
    confirmDialog('¿Eliminar acceso?', `Se quitará el acceso al teléfono ${ph}.`, () => {
      state.phoneUsers = state.phoneUsers.filter(x=>x!==ph);
      save(); renderAll(); toast('Número eliminado');
    });
  }
  else if(act==='reset-all'){
    confirmDialog('⚠️ Borrar TODO', 'Se eliminarán ventas, productos, clientes y entradas guardadas.', () => {
      localStorage.removeItem(KEY);
      location.reload();
    });
  }
  else if(act==='open-cart-modal') openCartModal();
});

document.addEventListener('input', e => {
  const inp = e.target.dataset.input;
  if(!inp) return;
  if(inp==='posSearch'){ state.ui.posSearch = e.target.value; renderPosGrid(); }
  else if(inp==='invSearch'){ state.ui.invSearch = e.target.value; renderInvList(); }
  else if(inp==='custSearch'){ state.ui.custSearch = e.target.value; renderView(); }
  else if(inp==='paid'){ state.paid = num(e.target.value); renderCartAside(); }
  else if(inp==='phone'){ state.phone = e.target.value; save(); }
  else if(inp==='creditCustomer'){ state.creditCustomerId = e.target.value; save(); }
  else if(inp==='qty'){
    const item = state.cart.find(i=>i.id===e.target.dataset.id);
    if(item){
      const val = num(e.target.value);
      const p = getProduct(item.id);
      if(p && val > p.stock){
        toast('Supera el stock disponible','warn');
        item.qty = p.stock;
      } else {
        item.qty = val;
      }
      if(item.qty <= 0) state.cart = state.cart.filter(i=>i.id!==item.id);
      save(); renderCartAside(); renderCartBar();
    }
  }
  else if(inp==='repMonth'){ state.ui.repMonth = e.target.value; renderView(); }
});

/* ── INICIALIZACIÓN DE LA APLICACIÓN ──────────────────────── */
renderApp();
</script>
