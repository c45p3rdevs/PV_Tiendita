const icon=(n,c='w-5 h-5')=>`<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="${c}"><path stroke-linecap="round" stroke-linejoin="round" d="${IC[n]||''}"/></svg>`;

/* ── ESTADO CENTRALIZADO ─────────────────────────────────── */
window.state = {
  loggedIn: false,
  currentPhone: '',
  phoneUsers: ['4481294345'],
  view: 'venta',
  products: [],
  sales: [],
  entries: [],
  customers: [],
  cart: [],
  paid: 0,
  payMethod: 'Efectivo',
  creditCustomerId: '',
  phone: '',
  settings: {store:'Mi Tiendita POS', symbol:'$', minStock:5},
  ui: {posSearch:'', posCat:'', invSearch:'', invCat:'', invLow:false, custSearch:'', entryProduct:'', repMonth:thisMonth()}
};

// Variable para controlar el scanner activo de cámara
let html5QrcodeScanner = null;

// Guardar datos globales en Firestore
async function save(){
  try {
    const payload = {
      phoneUsers: state.phoneUsers,
      products: state.products,
      sales: state.sales,
      entries: state.entries,
      customers: state.customers,
      settings: state.settings,
      updatedAt: new Date().toISOString()
    };
    await setDoc(storeDocRef, payload, { merge: true });
    renderBadge(true);
  } catch (e) {
    console.error("Error guardando datos en la nube:", e);
    renderBadge(false);
  }
}

// Escuchar cambios en tiempo real
onSnapshot(storeDocRef, (docSnap) => {
  if (docSnap.exists()) {
    const data = docSnap.data();
    state.phoneUsers = data.phoneUsers || ['4481294345'];
    state.products = data.products || [];
    state.sales = data.sales || [];
    state.entries = data.entries || [];
    state.customers = data.customers || [];
    if(data.settings) state.settings = data.settings;
    renderAll();
    renderBadge(true);
  } else {
    save();
  }
});

/* ── CÁLCULOS Y LOGICA DE NEGOCIO ────────────────────────── */
const getProduct=id=>state.products.find(p=>p.id===id), activeSales=()=>state.sales.filter(s=>!s.cancelled);
const getCustomer=id=>state.customers.find(c=>c.id===id);
const margin=p=>p.price>0?((p.price-p.cost)/p.price)*100:0;
const stats=list=>({revenue:list.reduce((a,s)=>a+s.total,0),profit:list.reduce((a,s)=>a+s.profit,0),units:list.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0),count:list.length,avg:list.length?list.reduce((a,s)=>a+s.total,0)/list.length:0});
const monthStats=ym=>stats(activeSales().filter(s=>monthOf(s.date)===ym));
const dayStats=ds=>stats(activeSales().filter(s=>s.date.slice(0,10)===ds));
function lastNDays(n){const out=[],now=new Date();for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;out.push({ds,...dayStats(ds)});}return out;}
function topProducts(ym,by='profit',limit=6){const m=new Map();activeSales().filter(s=>monthOf(s.date)===ym).forEach(s=>s.items.forEach(i=>{if(!m.has(i.id))m.set(i.id,{id:i.id,name:i.name,qty:0,revenue:0,profit:0});const o=m.get(i.id);o.qty+=i.qty;o.revenue+=i.price*i.qty;o.profit+=(i.price-i.cost)*i.qty;}));return [...m.values()].sort((a,b)=>b[by]-a[by]).slice(0,limit);}
function categoryProfit(ym){const m=new Map();activeSales().filter(s=>monthOf(s.date)===ym).forEach(s=>s.items.forEach(i=>{const p=getProduct(i.id),c=p?p.cat:'Otros';m.set(c,(m.get(c)||0)+(i.price-i.cost)*i.qty);}));return [...m.entries()].sort((a,b)=>b[1]-a[1]);}
const inventoryValue=()=>state.products.reduce((a,p)=>a+p.cost*p.stock,0), inventorySaleValue=()=>state.products.reduce((a,p)=>a+p.price*p.stock,0);
const lowStockList=()=>state.products.filter(p=>p.stock<=p.min).sort((a,b)=>a.stock-b.stock);
const stockState=p=>p.stock<=0?'out':(p.stock<=p.min?'low':'ok');
const productCats=()=>[...new Set(state.products.map(p=>p.cat))].sort();

function customerDebt(cId){
  const creditSales = activeSales().filter(s => s.payMethod==='Crédito' && s.customerId===cId);
  const totalCred = creditSales.reduce((sum, s) => sum + s.total, 0);
  const c = getCustomer(cId);
  const totalPaid = c && c.payments ? c.payments.reduce((sum, p) => sum + p.amount, 0) : 0;
  return Math.max(0, totalCred - totalPaid);
}
function customerProducts(cId){
  const creditSales = activeSales().filter(s => s.payMethod==='Crédito' && s.customerId===cId);
  const map = new Map();
  creditSales.forEach(s => s.items.forEach(i => {
    if(!map.has(i.name)) map.set(i.name, {name: i.name, qty: 0, total: 0});
    const item = map.get(i.name);
    item.qty += i.qty;
    item.total += (i.price * i.qty);
  }));
  return [...map.values()];
}
function totalGlobalDebt(){
  return state.customers.reduce((sum, c) => sum + customerDebt(c.id), 0);
}

/* ── INTERFAZ DE USUARIO Y MÓDALES ───────────────────────── */
function toast(msg,type='ok'){
  const S={ok:['bg-emerald-50 border-emerald-200 text-emerald-800','check','text-emerald-600'],warn:['bg-amber-50 border-amber-200 text-amber-900','warn','text-amber-600'],error:['bg-rose-50 border-rose-200 text-rose-800','warn','text-rose-600'],info:['bg-white border-slate-200 text-slate-700','bolt','text-indigo-600']}[type];
  const el=document.createElement('div');
  el.className=`pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-2xl border shadow-lg ${S[0]} pop`;
  el.innerHTML=`<span class="mt-0.5 ${S[2]}">${icon(S[1],'w-5 h-5')}</span><p class="text-[13.5px] font-semibold flex-1">${esc(msg)}</p>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s,transform .3s';el.style.opacity='0';el.style.transform='translateX(20px)';setTimeout(()=>el.remove(),320);},2600);
}
function stopCameraScanner(){
  if(html5QrcodeScanner){
    html5QrcodeScanner.stop().then(() => {
      html5QrcodeScanner.clear();
      html5QrcodeScanner = null;
    }).catch(err => {
      console.log("Scanner stop error", err);
      html5QrcodeScanner = null;
    });
  }
}
function openModal(html,mount){
  closeModal();
  $('#modalRoot').innerHTML=`<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center"><div data-action="close-modal" class="absolute inset-0 bg-slate-900/55 glass"></div><div class="relative w-full sm:max-w-lg max-h-[93vh] overflow-y-auto bg-white sm:rounded-3xl rounded-t-3xl shadow-2xl pop">${html}</div></div>`;
  document.body.style.overflow='hidden';
  if(mount)setTimeout(mount,0);
}
function closeModal(){
  stopCameraScanner();
  $('#modalRoot').innerHTML='';
  document.body.style.overflow='';
}
const modalHead=(t,s='')=>`<div class="sticky top-0 z-10 bg-white/95 glass px-5 py-4 border-b border-slate-100 flex items-start gap-3"><div class="flex-1 min-w-0"><h3 class="text-[17px] font-extrabold text-slate-900">${esc(t)}</h3>${s?`<p class="text-[11.5px] text-slate-500 mt-0.5">${esc(s)}</p>`:''}</div><button data-action="close-modal" class="w-9 h-9 shrink-0 grid place-items-center rounded-full hover:bg-slate-100 text-slate-500">${icon('x')}</button></div>`;

/* ── ESCÁNER CON CÁMARA EN TIEMPO REAL ───────────────────── */
function openCameraScannerModal(onScanSuccessCallback) {
  const html = modalHead('Escanear Código de Barras', 'Apunta la cámara al código de barras del producto') + `
  <div class="p-5 flex flex-col items-center justify-center space-y-4">
    <div id="cameraScannerView" class="w-full max-w-sm rounded-2xl overflow-hidden bg-slate-900 shadow-inner min-h-[260px] flex items-center justify-center"></div>
    <p class="text-xs text-slate-500 text-center">Coloca el código bien centrado en el recuadro para mejor lectura.</p>
    <button data-action="close-modal" class="w-full h-11 rounded-xl bg-slate-100 font-bold text-slate-700">Cancelar</button>
  </div>`;

  openModal(html, () => {
    html5QrcodeScanner = new Html5Qrcode("cameraScannerView");
    const config = { fps: 10, qrbox: { width: 250, height: 150 } };
    
    html5QrcodeScanner.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        stopCameraScanner();

function sendWhatsAppTicket(saleData, customPhone = '') {
  const store = state.settings.store || 'Mi Tiendita POS';
  const dateStr = saleData.date ? new Date(saleData.date).toLocaleString('es-MX') : new Date().toLocaleString('es-MX');
  let msg = `🧾 *TICKET DE COMPRA*\n🏪 *${store}*\n📅 ${dateStr}\n------------------------------\n`;
  saleData.items.forEach(item => {
    msg += `• ${item.name}\n  ${item.qty} x ${MXN(item.price)} = *${MXN(item.price * item.qty)}*\n`;
  });
  msg += `------------------------------\n💰 *TOTAL: ${MXN(saleData.total)}*\n💳 Pago: ${saleData.payMethod}\n`;
  if(saleData.payMethod === 'Crédito' && saleData.customerId){
    const c = getCustomer(saleData.customerId);
    if(c) msg += `👤 Cliente: ${c.name}\n`;
  }
  if (saleData.payMethod === 'Efectivo' && saleData.paid > 0) {
    msg += `💵 Recibido: ${MXN(saleData.paid)}\n🪙 Cambio: ${MXN(saleData.change)}\n`;
  }
  msg += `\n¡Gracias por su compra! 🙌`;
  const phone = (customPhone || state.phone || '').replace(/[^0-9]/g, '');
  window.open(phone ? `https://wa.me/${phone}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

function filteredInventory(){
  const q=state.ui.invSearch.trim().toLowerCase();
  return state.products.filter(p=>{
    if(state.ui.invLow && p.stock>p.min)return false;
    if(state.ui.invCat && p.cat!==state.ui.invCat)return false;
    if(q && !p.name.toLowerCase().includes(q) && !(p.barcode||'').toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name,'es'));
}

  if(f){
    f.onsubmit=async e=>{
      e.preventDefault();
      const pId=$('#entryProduct').value;
      const qty=num($('#entryQty').value);
      const newCost=$('#entryCost').value?num($('#entryCost').value):null;

      const p=getProduct(pId);
      if(!p || qty<=0) return toast('Selecciona producto y cantidad válida','warn');

      p.stock = r3(p.stock + qty);
      if(newCost!==null && newCost>0) p.cost = newCost;

      state.entries.unshift({id:uid(), date:stamp(), productId:pId, qty, cost: newCost||p.cost});
      await save();
      toast(`Stock actualizado para ${p.name}`,'ok');
      renderAll();
    };
  }
};

MOUNT.ajustes=()=>{
  const f=$('#settingsForm');
  if(f){
    f.onsubmit=async e=>{
      e.preventDefault();
      const store=$('#setStore').value.trim();
      if(!store) return toast('Completa los datos correctamente','warn');
      state.settings.store = store;
      await save();
      toast('Nombre guardado correctamente','ok');
      renderAll();
    };
  }

  const phoneForm = $('#addPhoneForm');
  if(phoneForm){
    phoneForm.onsubmit = async e => {
      e.preventDefault();
      const input = $('#newPhoneInput');
      if(!input) return;
      const clean = input.value.replace(/[^0-9]/g, '');
      if(!clean || clean.length < 8) return toast('Ingresa un número de teléfono válido', 'warn');
      if(state.phoneUsers.includes(clean)) return toast('Ese teléfono ya está registrado', 'warn');

      state.phoneUsers.push(clean);
      await save();
      input.value = '';
      toast('Teléfono registrado para dar de alta al usuario', 'ok');
      renderAll();
    };
  }
};

/* ── MANEJADOR CENTRAL DE EVENTOS (CLICK Y INPUTS) ───────── */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-action]');
  if(!b) return;
  const act = b.dataset.action;

  if(act==='go') go(b.dataset.view);
  else if(act==='logout'){ state.loggedIn = false; state.currentPhone = ''; renderApp(); toast('Sesión cerrada'); }
  else if(act==='close-modal') closeModal();
  else if(act==='product-new') openProductModal();
  else if(act==='product-edit') openProductModal(getProduct(b.dataset.id));
  else if(act==='product-del'){
    const id=b.dataset.id;
    state.products = state.products.filter(p=>p.id!==id);
    await save();
    toast('Producto eliminado','ok');
    renderAll();
  }
  else if(act==='scan-pos'){
    openCameraScannerModal((code) => {
      const p = state.products.find(item => item.barcode === code);
      if(p){
        if(p.stock <= 0){
          toast(`Producto "${p.name}" agotado`, 'warn');
        } else {
          const item = state.cart.find(i => i.id === p.id);
          if(item){
            if(item.qty >= p.stock){ toast('Stock máximo alcanzado', 'warn'); return; }
            item.qty = r3(item.qty + 1);
          } else {
            state.cart.push({id: p.id, name: p.name, price: p.price, cost: p.cost, qty: 1});
          }
          toast(`Agregado: ${p.name}`, 'ok');
          renderCartAside(); renderCartBar();
        }
      } else {
        state.ui.posSearch = code;
        renderPosGrid();
        toast(`Código de barras: ${code}. No registrado.`, 'info');
      }
    });
  }
  else if(act==='scan-product-form'){
    openCameraScannerModal((code) => {
      const barcodeInput = $('#pBarcode');
      if(barcodeInput){
        barcodeInput.value = code;
        toast(`Código capturado: ${code}`, 'ok');
      }
    });
  }
  else if(act==='remove-phone'){
    const ph = b.dataset.phone;
    if(state.phoneUsers.length <= 1) return toast('Debe haber al menos un número registrado', 'warn');
    state.phoneUsers = state.phoneUsers.filter(p => p !== ph);
    await save();
    toast('Número eliminado del sistema', 'ok');
    renderAll();
  }
  else if(act==='customer-new') openCustomerModal();
  else if(act==='pay-debt') openPayDebtModal(b.dataset.id);
  else if(act==='customer-del'){
    const id=b.dataset.id;
    state.customers = state.customers.filter(c=>c.id!==id);
    await save();
    toast('Cliente eliminado','ok');
    renderAll();
  }
  else if(act==='add'){
    const p = getProduct(b.dataset.id);
    if(!p || p.stock<=0) return;
    const item = state.cart.find(i=>i.id===p.id);
    if(item){
      if(item.qty >= p.stock){ toast('Stock máximo alcanzado en inventario','warn'); return; }
      item.qty = r3(item.qty + 1);
    } else {
      state.cart.push({id:p.id, name:p.name, price:p.price, cost:p.cost, qty:1});
    }
    renderCartAside(); renderCartBar();
  }
  else if(act==='qty-inc'){
    const item = state.cart.find(i=>i.id===b.dataset.id);
    const p = getProduct(b.dataset.id);
    if(item && p){
      if(item.qty >= p.stock){ toast('No hay más stock disponible','warn'); return; }
      item.qty = r3(item.qty + 1);
      renderCartAside(); renderCartBar();
    }
  }
  else if(act==='qty-dec'){
    const item = state.cart.find(i=>i.id===b.dataset.id);
    if(item){
      item.qty = r3(item.qty - 1);
      if(item.qty<=0) state.cart = state.cart.filter(i=>i.id!==b.dataset.id);
      renderCartAside(); renderCartBar();
    }
  }
  else if(act==='cart-del'){
    state.cart = state.cart.filter(i=>i.id!==b.dataset.id);
    renderCartAside(); renderCartBar();
  }
  else if(act==='cart-clear'){
    state.cart = [];
    renderCartAside(); renderCartBar();
  }
  else if(act==='pay'){
    state.payMethod = b.dataset.m;
    renderCartAside();
  }
  else if(act==='quick-paid'){
    state.paid = num(b.dataset.v);
    renderCartAside();
  }
  else if(act==='pos-cat'){
    state.ui.posCat = b.dataset.cat;
    renderPosChips(); renderPosGrid();
  }
  else if(act==='inv-cat'){
    state.ui.invLow = false;
    state.ui.invCat = b.dataset.cat;
    renderAll();
  }
  else if(act==='inv-filter-low'){
    state.ui.invLow = !state.ui.invLow;
    renderAll();
  }
  else if(act==='open-cart-modal'){
    openModal(modalHead('Carrito de Venta')+`<div class="p-4">${cartHTML()}</div>`);
  }
  else if(act==='checkout'){
    const t = cartTotals();
    if(!state.cart.length) return;
    if(state.payMethod==='Crédito' && !state.creditCustomerId){
      return toast('Por favor selecciona un cliente para fiar','warn');
    }

    state.cart.forEach(item => {
      const prod = getProduct(item.id);
      if(prod) prod.stock = r3(prod.stock - item.qty);
    });

    const sale = {
      id: uid(),
      date: stamp(),
      items: [...state.cart],
      total: t.sub,
      profit: t.profit,
      payMethod: state.payMethod,
      customerId: state.creditCustomerId,
      paid: state.paid,
      change: t.change
    };

    state.sales.unshift(sale);
    state.cart = [];
    state.paid = 0;
    state.creditCustomerId = '';
    
    await save();
    closeModal();
    showSuccess(sale.total, sale.change, sale.payMethod, sale);
    renderAll();
  }
});

document.addEventListener('input', e => {
  const input = e.target.closest('[data-input]');
  if(!input) return;
  const field = input.dataset.input;
  
  if(field==='posSearch'){ state.ui.posSearch = input.value; renderPosGrid(); }
  else if(field==='invSearch'){ state.ui.invSearch = input.value; renderInvList(); }
  else if(field==='custSearch'){ state.ui.custSearch = input.value; renderView(); }
  else if(field==='paid'){ state.paid = num(input.value); renderCartAside(); }
  else if(field==='creditCustomer'){ state.creditCustomerId = input.value; }
  else if(field==='repMonth'){ state.ui.repMonth = input.value; renderView(); }
  else if(field==='qty'){
    const item = state.cart.find(i=>i.id===input.dataset.id);
    const p = getProduct(input.dataset.id);
    if(item && p){
      let val = num(input.value);
      if(val > p.stock) val = p.stock;
      item.qty = val;
      renderCartAside();
    }
  }
});

// Inicializar la aplicación al cargar
renderApp();
</script>
